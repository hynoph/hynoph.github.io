<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ad7f0"/>
      <stop offset="1" stop-color="#3b5bb5"/>
    </linearGradient>
    <clipPath id="front"><rect x="0" y="32" width="64" height="32"/></clipPath>
  </defs>
  <g transform="rotate(-24 32 32)">
    <!-- back half of the ring, drawn behind the planet -->
    <ellipse cx="32" cy="32" rx="29" ry="8" fill="none" stroke="#f2c38b" stroke-width="4"/>
    <circle cx="32" cy="32" r="16" fill="url(#planet)"/>
    <!-- front half of the ring, drawn over the planet -->
    <ellipse cx="32" cy="32" rx="29" ry="8" fill="none" stroke="#f2c38b" stroke-width="4" clip-path="url(#front)"/>
  </g>
</svg>
